    <rect x="44" y="289" width="105" height="29" rx="6" fill="#ffad33" fill-opacity=".13" stroke="#ffad33" stroke-opacity=".5"/>
    <text x="96" y="309" font-size="13" text-anchor="middle" fill="#ffd197">DVA-C03</text>
    <text x="171" y="309" font-size="14" fill="#aab7cd">12 semanas · 4 h / semana</text>
    <rect x="578" y="80" width="575" height="246" rx="12" fill="#0b101b" stroke="#35425b"/>
    <text x="602" y="112" font-size="13" fill="#818cf8">PROYECTO / API DE TAREAS</text>
    <path d="M706 176H755M870 176H918" stroke="#536582" stroke-width="2"/>
    <path d="m748 171 7 5-7 5m163-10 7 5-7 5" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <rect x="601" y="149" width="105" height="53" rx="8" fill="#15283b" stroke="#22d3ee" stroke-opacity=".6"/>
