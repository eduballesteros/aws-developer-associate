    <rect x="755" y="149" width="115" height="53" rx="8" fill="#30251a" stroke="#ffad33" stroke-opacity=".6"/>
    <text x="812" y="181" text-anchor="middle" font-size="15" fill="#ffd197">Lambda</text>
    <rect x="918" y="149" width="210" height="53" rx="8" fill="#25233d" stroke="#818cf8" stroke-opacity=".6"/>
    <text x="1023" y="181" text-anchor="middle" font-size="15" fill="#c4c8ff">DynamoDB</text>
