<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">AWS Developer Associate: aprender construyendo</title>
  <desc id="desc">Portada de terminal oscura con la ruta Java, API, Lambda y DynamoDB. Doce semanas, cuatro horas semanales y preparación DVA-C03.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b0f19"/><stop offset="1" stop-color="#151c2d"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#253048" stroke-opacity=".35"/></pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="398" rx="18" fill="url(#bg)" stroke="#303b52"/>
  <rect x="1" y="1" width="1198" height="398" rx="18" fill="url(#grid)"/>
  <path d="M19 1H1181Q1199 1 1199 19V43H1V19Q1 1 19 1Z" fill="#1c2435"/>
  <g><circle cx="25" cy="22" r="6" fill="#fb7185"/><circle cx="47" cy="22" r="6" fill="#fbbf24"/><circle cx="69" cy="22" r="6" fill="#34d399"/></g>
  <text x="600" y="27" text-anchor="middle" font-family="Consolas,monospace" font-size="13" fill="#aab7cd">edu@cloud: ~/aws-developer-associate</text>
  <g font-family="Consolas,'Courier New',monospace">
    <text x="44" y="91" font-size="15" fill="#22d3ee">$ aprender --construyendo</text>
    <text x="44" y="144" font-size="40" font-weight="700" fill="#f1f5f9">AWS Developer</text>
    <text x="44" y="192" font-size="40" font-weight="700" fill="#ffad33">Associate</text>
